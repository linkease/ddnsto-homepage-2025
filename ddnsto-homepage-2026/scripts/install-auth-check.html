<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>DDNSTO 扫码联调</title>
    <style>
      body {
        font: 16px/1.6 system-ui;
        background: #0a0a0f;
        color: #eee;
        margin: 0;
      }
      main {
        max-width: 540px;
        margin: 48px auto;
        padding: 24px;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        cursor: pointer;
        margin: 4px;
      }
      img {
        display: block;
        width: 224px;
        height: 224px;
        margin: 24px 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>微信扫码验证</h1>
      <p>正式后端 · M1 认证联调。仅验证登录和设备令牌获取，不运行安装命令。</p>
      <p id="status" role="status">点击开始后获取二维码。</p>
      <img
        id="qr"
        hidden
        alt="微信登录二维码，可使用微信扫码或在微信内长按识别"
      />
      <button id="start" type="button">开始扫码 / 刷新二维码</button>
      <button id="cancel" type="button">取消并清除本页令牌</button>
      <p>取消不会退出控制台账号；本页不显示、保存或记录令牌原文。</p>
    </main>
    <script type="module" src="/scripts/install-auth-check.ts"></script>
  </body>
</html>
